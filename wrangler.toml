# RINACE · Cloudflare Workers 部署配置
# 静态站点 + Worker 入口（/api/* 留给后端，其余交给 Static Assets）。
#
# 本文件由 _audit/regen.py 根据 config/cloudflare.json 生成，别手改
# （手改会在下次发布时被覆盖）。
#
# name 必须与控制台里 Worker 的实际名字一致。
# 访问：https://deltanarin.com/RINACE/
# 挂载：Worker → Settings → Domains & Routes → Route: deltanarin.com/RINACE/*
name = "eaf1-analysis"
main = "worker/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./cloudflare"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ============================================================
# 后端（M5 只读 API / M6 管理接口）
# D1 数据用 d1/seed.sql 导入（Actions → D1 import (seed)，
# 或 npx wrangler d1 execute ... --remote --file=./d1/seed.sql）。
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "eaf1-analysis"
database_id = "a2eab2f9-823e-4855-bb02-dd8c56df9685"

# 管理接口 secrets（wrangler secret put <NAME>）：
#   ADMIN_TOKEN    —— /api/admin/* 的 Bearer token
#   GITHUB_TOKEN   —— 可选，/api/admin/rebuild 发 repository_dispatch
#   GITHUB_REPO    —— 可选，默认 HRiver2/EAF1-Analysis
#
# Access 建议保护 deltanarin.com/RINACE/api/admin/*（Zero Trust → Access）。
# [triggers]
# crons = ["0 * * * *"]   # 默认不用：同步按"每场比赛"手动触发
