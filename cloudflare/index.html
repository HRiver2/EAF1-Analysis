    <!-- 站点图标：用户提供的插画裁成 340×340 脸部方图后导出的多尺寸图标。
         `/RINACE/` 由 Vite 构建时替换成 --base（GitHub Pages 是 /EAF1-Analysis/，
         Cloudflare 是 /RINACE/），三个部署目标都能正确加载。 -->

    <link rel="icon" type="image/png" sizes="32x32" href="/RINACE/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/RINACE/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/RINACE/apple-touch-icon.png" />
    <link rel="manifest" href="/RINACE/site.webmanifest" />
    <!-- 移动端浏览器地址栏颜色跟随明暗模式（站点默认跟随系统） -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08111f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- 主题在首屏渲染前定好，避免闪一下 classic 再切到 glass。
         `?theme=classic` 优先于 localStorage，方便分享「旧版回顾」链接。 -->
    <script>
      (function () {
        function pick() {
          try {
            var q = new URLSearchParams(location.search).get('theme')
            if (q === 'classic' || q === 'glass') return q
            return localStorage.getItem('rinace-theme-v2') || 'glass'
          } catch (e) { return 'glass' }
        }
        var t = pick()
        document.documentElement.dataset.theme = t
        // 明暗是**独立一维**：?mode= 优先，其次 localStorage，默认浅色
        try {
          // 明暗优先级（2026-10-20 用户要求「优先跟随系统」）：
          //   ① ?mode= 显式指定（分享链接用）
          //   ② 本次会话里在弹窗中手动选过 → 用那个
          //   ③ **其余一律跟随系统** prefers-color-scheme
          // 手选只进 sessionStorage：重新打开页面又会回到系统设置，
          // 这样改系统深浅色时站点一定跟着变。
          var mq = new URLSearchParams(location.search).get('mode')
          var sessionPick = sessionStorage.getItem('rinace-mode-session')
          var m
          if (mq === 'dark' || mq === 'light') m = mq
          else if (sessionPick === 'dark' || sessionPick === 'light') m = sessionPick
          else m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.mode = m
        } catch (e2) { document.documentElement.dataset.mode = 'light' }
        try { localStorage.setItem('rinace-theme-v2', t) } catch (e) {}
        window.__rinaceTheme = function (v) {
          document.documentElement.dataset.theme = v
          try { localStorage.setItem('rinace-theme-v2', v) } catch (e) {}
        }
      })()
    </script>
