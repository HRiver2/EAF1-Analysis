    <!-- 主题在首屏渲染前定好，避免闪一下 classic 再切到 glass。
         `?theme=classic` 优先于 localStorage，方便分享「旧版回顾」链接。 -->
    <script>
      (function () {
        function pick() {
          try {
            var q = new URLSearchParams(location.search).get('theme')
            if (q === 'classic' || q === 'glass') return q
            return localStorage.getItem('rinace-theme') || 'glass'
          } catch (e) { return 'glass' }
        }
        var t = pick()
        document.documentElement.dataset.theme = t
        try { localStorage.setItem('rinace-theme', t) } catch (e) {}
        window.__rinaceTheme = function (v) {
          document.documentElement.dataset.theme = v
          try { localStorage.setItem('rinace-theme', v) } catch (e) {}
        }
      })()
    </script>
